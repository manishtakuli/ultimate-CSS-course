<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: antiquewhite
        }
        .red{
            color: red;
        }
        .yellow{
            color: yellow;
        }
        .blue{
            color: blue;  
        }

    </style>
</head>
<body>
    <!-- specificity 1000 -->
     <h1 style="color: brown;" class="red yellow blue ">This is the heading<h1>
                <!--style selector applied so according to specificity style is prefered 1st -->
    
</body>
</html>
<!-- inline selector > id selector > class attribute selector > element selector > universal selector  -->
