<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            color: antiquewhite
        }
        .red{
            color: red;
        }
        .yellow{
            color: yellow;
        }
        .blue{
            color: blue;  /* this color will be apply due to positioning and order of apperance */
        }

    </style>
</head>
<body>
    <h1 class="red yellow blue ">This is the heading</h1>
    
</body>
</html>
<!-- inline selector > id selector > class attribute selector > element selector > universal selector  -->
