<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        html{
            font-size: 12px;
        }
        *{
             margin: 0;
            padding: 0;
        }
        .pixel{
            border: 2px solid blue;
            width: 80vw;   
            margin: auto;   
            height: 10 vh; 
            background-color: aqua;
        }
        .box{
               border: 2px solid blue;
            width: 80vw;   
            margin: 23px auto; 
            height: 50vh; 
            font-size: 20px;
            background-color: aqua;

        .box p {
            font-size: 2rem; /*gives the size of the font 2times thh root html font. that is 12*2 */ 
        }
        
    </style>
</head>
<body>
    <div class="pixel">
         this is about 
    </div>
    
    <div class="box">
        <p>top bottom margin </p>
        
       
    </div>
</body>
</html>
