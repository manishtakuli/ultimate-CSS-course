<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styling list</title>
    <style>
        nav ul li {
            list-style: devanagari ; /* setting marker type  */
            background-color: aqua;
            list-style-position: inside; /* setting marker inside the list to apply background-color to them   */
            border: 2px solid blue;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>home</li>
            <li>page</li>
            <li>next</li>
        </ul>
    </nav>
</body>

</html>
