<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styling list</title>
    <style>
        nav ul li {
             list-style-type: "🍌";/*setting marker type emoji  */
            /* list-style-image:url("https:");  add image url here  */
            /* list-style-type: disc;           for default bullets */
            background-color: aqua;
            list-style-position: inside; 
           
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>home</li>
            <li>page</li>
            <li>next</li>
            <li>list</li>
        </ul>
    </nav>
</body>

</html>
