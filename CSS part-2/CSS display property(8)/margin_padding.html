<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display property in css </title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .box {
            border: 2px solid blue;
            display: inline-block;
            /* now using inlinw block the margin and padding are applied from top as well */
            margin: 10px;
            padding: 20px;
        }

        .box1 {
            /* display: none;   for removing the space and display */
            /* visibility: hidden;  for hiding only not removing the space */
        }
    </style>

</head>

<body>
    <div class="box box1">i am a boy</div> <!-- block element -->
    <div class="box">a good box</div>
    <span>i am good</span> <!-- */inline element*/  -->
    <span> boy</span>


</body>

</html>
