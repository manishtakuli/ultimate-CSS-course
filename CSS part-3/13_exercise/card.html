<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> creating a card</title>
    <style>
        body {
            background-color: rgb(238, 217, 190);

        }

        * {
            margin: 0;
            padding: 0;
        }

        .card {
            background-color: aliceblue;
            height: 310px;
            width: 150px;
            border-radius: 10px;
        }

        .image {
            padding: 5px;
        }

        .image img {
            border-radius: 9px;
        }

        .content {
            padding: 10px 13px;
            font-size: 13px;
        }

        .capsule {
            padding: 0 13px;
        }

        .capsule span {
            border: 1px solid rgb(28, 33, 4);
            padding: 0 5px;
            border-radius: 4px;
            font-size: 9px;
        }

        .button {
            text-align: center;
           
        }

        .button button {
            font-size: 9px;
            border-radius: 9px;
            border: none;
            padding: 0 6px;
            color: rgb(205, 226, 43);
            background-color: rgb(66, 155, 239);
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="image">
            <img width="140" src="goat.jpg" alt="">
        </div>
        <div class="capsule">
            <span>like</span>
            <span>share</span>
        </div>
        <div class="content">
            <h2>about the goat</h2>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Assumenda, quidem. Iusto veritatis accusamus
                qui! Ex, amet impedit! Animi, sit similique?</p>
        </div>
        <div class="button">
            <button>read more</button>
        </div>

    </div>

</body>

</html>
